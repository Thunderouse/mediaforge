name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxkbcommon0

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pytest ruff PySide6-Essentials

      - name: линтер
        run: python -m ruff check --select F,E9 .

      - name: синтаксис всех модулей
        run: python -m compileall -q mediaforge tools

      - name: тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -rs --no-header

      # UI-тесты отдельным шагом: если Qt не поднялся, они падают (см. тесты),
      # а не пропускаются молча
      - name: UI-тесты
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
        run: python -m pytest -rs --no-header tests/test_ui_lifecycle.py tests/test_sidebar_trim.py
