name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: Windows + Linux пакеты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: версия в коде совпадает с тегом
        run: |
          version=$(python3 tools/version.py)
          echo "версия в коде: $version · тег: $GITHUB_REF_NAME"
          test "$version" = "${GITHUB_REF_NAME#v}"

      - name: ffmpeg для тестов ядра
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: тесты ядра (с ffmpeg, без пропусков)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pillow
          python -m pytest tests/test_core.py -q -rs --junitxml=pytest-core.xml
          # пропуск теста = гейт не пройден: без ffmpeg половина набора молча
          # выпадает, и релиз собирается по непроверенному коду
          python -c "import sys, xml.etree.ElementTree as ET; root = ET.parse('pytest-core.xml').getroot(); s = root if root.tag == 'testsuite' else root.find('testsuite'); t = int(s.get('tests', 0)); f = int(s.get('failures', 0)) + int(s.get('errors', 0)); k = int(s.get('skipped', 0)); print(f'итог: passed={t - f - k}, failed={f}, skipped={k}'); sys.exit(1 if (k or f) else 0)"

      - name: инструменты сборки
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pefile pyelftools ziglang

      - name: иконки
        run: python tools/make_icons.py

      - name: Windows portable
        run: python tools/build_portable.py --stage build/pw --out out --cache build/cw

      - name: проверка Windows-сборки
        run: |
          dir=$(ls -d build/pw/MediaForge-* | head -1)
          echo "проверяю $dir"
          python tools/check_portable.py "$dir"

      - name: Linux x86_64
        run: >-
          python tools/build_portable_unix.py --target linux-x86_64
          --out out --cache build/cu --stage build/su

      - name: Linux aarch64
        run: >-
          python tools/build_portable_unix.py --target linux-aarch64
          --out out --cache build/cu --stage build/su

      - name: исходники
        run: git archive --format=zip -o out/mediaforge-src.zip HEAD

      - name: размеры
        run: ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: иконки
        run: |
          python tools/make_icons.py
          mkdir -p assets/MediaForge.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s assets/icon.png --out assets/MediaForge.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out assets/MediaForge.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns assets/MediaForge.iconset -o assets/icon.icns

      - name: сборка .app
        run: python -m PyInstaller MediaForge.spec --noconfirm --clean

      - name: архив
        run: |
          mkdir -p out
          version=$(python tools/version.py)
          ditto -c -k --sequesterRsrc --keepParent dist/MediaForge.app \
            "out/MediaForge-${version}-macos-arm64.zip"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    name: публикация релиза
    needs: [packages, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: gh release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # gh не в git-репозитории (нет checkout) — репозиторий задаём явно
          if gh release view "$GITHUB_REF_NAME" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* -R "$REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* -R "$REPO" \
              --title "MediaForge ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release view "$GITHUB_REF_NAME" -R "$REPO" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'
